<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Viva Leve</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viva Leve">
<meta name="theme-color" content="#7C3AED">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Viva Leve — acompanhe peso, água, treinos e hábitos com foco e elegância.">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<style>
  :root{
    --bg:#F7F5FC;
    --bg-gradient:radial-gradient(circle at 50% 0%, #EDE9FE 0%, #F7F5FC 70%);
    --card:#FFFFFF;
    --card-elevated:#FAF8FF;
    --primary:#7C3AED;
    --primary-soft:rgba(124, 58, 237, 0.08);
    --primary-glow:rgba(124, 58, 237, 0.25);
    --lilac:#8B5CF6;
    --lilac-soft:rgba(139, 92, 246, 0.12);
    --gold:#D97706;
    --gold-soft:rgba(217, 119, 6, 0.12);
    --blue:#2563EB;
    --blue-soft:rgba(37, 99, 235, 0.12);
    --green:#10B981;
    --green-soft:rgba(16, 185, 129, 0.12);
    --red:#EF4444;
    --red-soft:rgba(239, 68, 68, 0.12);
    --orange:#F59E0B;
    --orange-soft:rgba(245, 158, 11, 0.12);
    --purple:#7C3AED;
    --purple-soft:rgba(124, 58, 237, 0.10);
    --text:#1E1736;
    --muted:#6B6382;
    --border:#E8E2F8;
    --radius:16px;
    color-scheme:light;
  }
  html[data-theme="light"]{
    --bg:#F7F5FC;
    --bg-gradient:radial-gradient(circle at 50% 0%, #EDE9FE 0%, #F7F5FC 70%);
    --card:#FFFFFF;
    --card-elevated:#FAF8FF;
    --primary:#7C3AED;
    --primary-soft:rgba(124, 58, 237, 0.08);
    --primary-glow:rgba(124, 58, 237, 0.25);
    --lilac:#8B5CF6;
    --lilac-soft:rgba(139, 92, 246, 0.12);
    --gold:#D97706;
    --gold-soft:rgba(217, 119, 6, 0.12);
    --blue:#2563EB;
    --blue-soft:rgba(37, 99, 235, 0.12);
    --green:#10B981;
    --green-soft:rgba(16, 185, 129, 0.12);
    --red:#EF4444;
    --red-soft:rgba(239, 68, 68, 0.12);
    --orange:#F59E0B;
    --orange-soft:rgba(245, 158, 11, 0.12);
    --purple:#7C3AED;
    --purple-soft:rgba(124, 58, 237, 0.10);
    --text:#1E1736;
    --muted:#6B6382;
    --border:#E8E2F8;
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --bg:#0B0A12;
    --bg-gradient:radial-gradient(circle at 50% 0%, #1E1238 0%, #0B0A12 70%);
    --card:#151226;
    --card-elevated:#1D1934;
    --primary:#8B5CF6;
    --primary-soft:rgba(139, 92, 246, 0.16);
    --primary-glow:rgba(139, 92, 246, 0.35);
    --lilac:#C4B5FD;
    --lilac-soft:rgba(196, 181, 253, 0.12);
    --gold:#F59E0B;
    --gold-soft:rgba(245, 158, 11, 0.16);
    --blue:#60A5FA;
    --blue-soft:rgba(96, 165, 250, 0.14);
    --green:#34D399;
    --green-soft:rgba(52, 211, 153, 0.14);
    --red:#F87171;
    --red-soft:rgba(248, 113, 113, 0.14);
    --orange:#F59E0B;
    --orange-soft:rgba(245, 158, 11, 0.14);
    --purple:#8B5CF6;
    --purple-soft:rgba(139, 92, 246, 0.16);
    --text:#F5F3FF;
    --muted:#9CA3AF;
    --border:#262140;
    color-scheme:dark;
  }
  html[data-theme="red"]{
    --bg:#FFF9F9;
    --card:#FFFFFF;
    --primary:#DC2626;
    --primary-soft:#FDE6E6;
    --text:#241414;
    --muted:#7A6363;
    --border:#F2DEDE;
    color-scheme:light;
  }
  html[data-theme="green"]{
    --bg:#F9FFFB;
    --card:#FFFFFF;
    --primary:#16A34A;
    --primary-soft:#E2F7E9;
    --text:#142418;
    --muted:#647A6C;
    --border:#DEF2E5;
    color-scheme:light;
  }
  html[data-theme="pink"]{
    --bg:#FFF9FC;
    --card:#FFFFFF;
    --primary:#DB2777;
    --primary-soft:#FCE4F0;
    --text:#241420;
    --muted:#7A6373;
    --border:#F2DEEB;
    color-scheme:light;
  }
  html[data-theme="blue"]{
    --bg:#F9FBFF;
    --card:#FFFFFF;
    --primary:#2563EB;
    --primary-soft:#E2EBFC;
    --text:#141C24;
    --muted:#63707A;
    --border:#DEE7F2;
    color-scheme:light;
  }
  .theme-swatch{display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; cursor:pointer; padding:4px; width:auto;}
  .theme-swatch .ts-dot{width:38px; height:38px; border-radius:50%; border:2px solid var(--border); position:relative; box-shadow:inset 0 0 0 3px var(--card);}
  .theme-swatch.active .ts-dot{border-color:var(--text); border-width:2.5px;}
  .theme-swatch.active .ts-dot::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.3);}
  .theme-swatch .ts-label{font-size:10.5px; font-weight:700; color:var(--muted);}
  .theme-swatch.active .ts-label{color:var(--text);}
  .theme-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:2px;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column;}

  .topbar{
    background:var(--primary); color:#fff; padding:16px 16px calc(14px + env(safe-area-inset-top)) 16px;
    padding-top:calc(16px + env(safe-area-inset-top));
    display:flex; align-items:center; gap:6px; position:sticky; top:0; z-index:20;
  }
  .topbar h1{font-size:18px; margin:0; font-weight:700; flex:1;}
  .topbar .action{background:none; border:none; color:#fff; font-size:19px; cursor:pointer; padding:4px 9px; border-radius:8px; flex-shrink:0;}
  .topbar .action:active{background:rgba(255,255,255,.15);}

  main{flex:1; padding:14px 14px 100px 14px; overflow-x:hidden;}

  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--card); border-top:1px solid var(--border);
    display:flex; padding-bottom:env(safe-area-inset-bottom);
    max-width:560px; margin:0 auto;
  }
  .tabbar button{
    flex:1; background:none; border:none; padding:9px 2px 8px 2px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-size:10px; font-weight:700;
    min-width:0;
  }
  .tabbar button span:last-child{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .tabbar button .ticon{font-size:20px;}
  .tabbar button.active{color:var(--primary);}

  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
  .section-label{font-size:12.5px; font-weight:800; color:var(--text); text-transform:uppercase; letter-spacing:.04em; margin:16px 2px 8px 2px; display:flex; align-items:center; justify-content:space-between;}
  .section-label:first-child{margin-top:2px;}
  .hint{font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.5;}
  .warn-box{background:var(--orange-soft); border:1px solid var(--orange); color:var(--text); font-size:12px; padding:10px 12px; border-radius:10px; margin-bottom:14px; line-height:1.5;}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--primary); color:#fff; border:none; border-radius:12px; padding:14px 18px;
    font-size:15px; font-weight:700; cursor:pointer; width:100%;
  }
  .btn:active{opacity:0.85;}
  .btn.secondary{background:var(--card); color:var(--primary); border:1.5px solid var(--primary);}
  .btn.ghost{background:none; color:var(--primary); border:none; padding:8px; width:auto; font-weight:700; font-size:14px;}
  .btn.small{padding:9px 12px; font-size:13px; width:auto;}
  .btn.danger{background:var(--red);}
  .btn.chip{padding:9px 14px; border-radius:20px; font-size:13px; width:auto; background:var(--primary-soft); color:var(--primary); font-weight:800;}

  .empty-state{text-align:center; padding:36px 16px; color:var(--muted);}
  .empty-state .e-emoji{font-size:34px; margin-bottom:8px;}
  .empty-state .e-text{font-size:13.5px;}

  /* Home greeting */
  .greeting{padding:6px 2px 14px 2px;}
  .greeting .gtitle{font-size:22px; font-weight:800; color:var(--text);}
  .greeting .gdate{font-size:12.5px; color:var(--muted); margin-top:2px; text-transform:capitalize;}

  /* Stat cards grid */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .stat-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; cursor:pointer;}
  .stat-card .sc-top{display:flex; align-items:center; justify-content:space-between;}
  .stat-card .sc-icon{font-size:18px;}
  .stat-card .sc-label{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:8px;}
  .stat-card .sc-val{font-size:19px; font-weight:800; color:var(--text); margin-top:2px;}
  .stat-card .sc-sub{font-size:11px; color:var(--muted); margin-top:2px;}
  .stat-card .sc-track{height:5px; background:var(--border); border-radius:3px; margin-top:9px; overflow:hidden;}
  .stat-card .sc-fill{height:100%; border-radius:3px;}
  .stat-card.full{grid-column:1/-1;}

  /* Ring */
  .ring-wrap{position:relative; width:100px; height:100px; flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring-label .rval{font-size:15px; font-weight:800; color:var(--text);}
  .ring-label .rsub{font-size:8.5px; color:var(--muted); text-transform:uppercase;}

  /* Water screen */
  .water-hero{display:flex; align-items:center; gap:18px; padding:8px 4px 4px 4px;}
  .water-quick{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .water-quick button{flex:1; min-width:70px;}

  /* Chart */
  .chart-wrap{width:100%; overflow:hidden;}
  .chart-wrap svg{width:100%; height:auto; display:block;}
  .range-tabs{display:flex; gap:6px; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:12px;}
  .range-tabs button{flex:1; border:none; background:none; padding:8px 4px; border-radius:9px; font-size:12px; font-weight:700; color:var(--muted); cursor:pointer;}
  .range-tabs button.active{background:var(--primary); color:#fff;}

  /* Weight list */
  .entry-row{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:8px;}
  .entry-row .er-date{font-size:11.5px; color:var(--muted); width:64px; flex-shrink:0;}
  .entry-row .er-val{flex:1; font-size:16px; font-weight:800; color:var(--text);}
  .entry-row .er-diff{font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:20px;}
  .entry-row .er-diff.down{background:var(--green-soft); color:var(--green);}
  .entry-row .er-diff.up{background:var(--red-soft); color:var(--red);}
  .entry-row .er-diff.same{background:var(--border); color:var(--muted);}
  .entry-row .er-del{background:none; border:none; color:var(--red); font-size:15px; cursor:pointer; padding:4px;}

  /* Meals */
  .meal-group{margin-bottom:14px;}
  .meal-group .mg-title{font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; display:flex; justify-content:space-between;}
  .meal-row{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:11px 12px; margin-bottom:6px;}
  .meal-row .mr-name{flex:1; font-size:14.5px; font-weight:600; color:var(--text);}
  .meal-row .mr-kcal{font-size:13px; font-weight:800; color:var(--primary);}
  .meal-row .mr-del{background:none; border:none; color:var(--red); font-size:15px; cursor:pointer; padding:2px 4px;}

  /* Habits */
  .habit-row{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:8px;}
  .habit-top{display:flex; align-items:center; gap:12px;}
  .check{
    width:26px; height:26px; border-radius:8px; border:2px solid var(--border); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--card); font-size:15px; color:#fff;
  }
  .check.checked{background:var(--primary); border-color:var(--primary);}
  .habit-name{flex:1; font-size:15px; font-weight:700; color:var(--text);}
  .habit-streak{font-size:11.5px; color:var(--orange); font-weight:700; white-space:nowrap;}
  .habit-del{background:none; border:none; color:var(--red); font-size:15px; cursor:pointer; padding:2px 4px;}
  .habit-grid{display:flex; gap:4px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}
  .hg-day{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;}
  .hg-day .hgd-label{font-size:8.5px; color:var(--muted); font-weight:700;}
  .hg-day .hgd-dot{width:18px; height:18px; border-radius:6px; background:var(--border);}
  .hg-day .hgd-dot.on{background:var(--primary);}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:100;}
  .overlay.hidden{display:none;}
  .modal{background:var(--card); color:var(--text); width:100%; max-width:560px; border-radius:20px 20px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)) 18px; max-height:85vh; overflow-y:auto;}
  .modal h2{margin:0 0 14px 0; font-size:17px; color:var(--text);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--text); margin-bottom:6px;}
  .field input, .field select{
    width:100%; padding:12px; border:1.5px solid var(--border); border-radius:10px; font-size:16px; background:var(--bg); color:var(--text);
    -webkit-appearance:none; appearance:none;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--primary);}
  .seg{display:flex; gap:8px; flex-wrap:wrap;}
  .seg button{
    flex:1; min-width:70px; padding:11px 6px; border-radius:10px; border:1.5px solid var(--border); background:var(--bg);
    font-size:13px; font-weight:700; color:var(--text); cursor:pointer;
  }
  .seg button.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-actions .btn{flex:1;}
  .dt-row{display:flex; gap:10px;}
  .dt-row .field{flex:1; margin-bottom:0;}

  .settings-row{display:flex; align-items:center; justify-content:space-between; padding:12px 2px; border-bottom:1px solid var(--border);}
  .settings-row:last-child{border-bottom:none;}
  .settings-row .srow-label{font-size:14.5px; font-weight:600; color:var(--text);}
  .settings-row .srow-sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .switch{position:relative; width:46px; height:26px; background:var(--border); border-radius:20px; border:none; cursor:pointer; flex-shrink:0;}
  .switch.on{background:var(--primary);}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; background:#fff; border-radius:50%; transition:left .15s;}
  .switch.on::after{left:23px;}

  .install-banner{display:flex; align-items:center; gap:12px; background:var(--primary-soft); border:1px solid var(--primary); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px;}
  .install-banner .ib-text{flex:1; font-size:12.5px; color:var(--text); line-height:1.4;}

  /* Coach tips */
  .coach-card{background:linear-gradient(135deg, var(--primary-soft), var(--card)); border:1px solid var(--primary); border-radius:var(--radius); padding:14px; margin-bottom:14px;}
  .coach-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .coach-head .ci{font-size:20px;}
  .coach-head .ct{font-size:13px; font-weight:800; color:var(--text); text-transform:uppercase; letter-spacing:.03em;}
  .coach-msg{display:flex; gap:8px; align-items:flex-start; margin-bottom:9px; font-size:13.5px; line-height:1.5; color:var(--text);}
  .coach-msg:last-child{margin-bottom:0;}
  .coach-msg .cm-dot{width:6px; height:6px; border-radius:50%; background:var(--primary); margin-top:7px; flex-shrink:0;}

  /* Sub tabs (Comida: Hoje/Receitas) */
  .subtabs{display:flex; gap:6px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:14px;}
  .subtabs button{flex:1; border:none; background:none; padding:9px 4px; border-radius:9px; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer;}
  .subtabs button.active{background:var(--primary); color:#fff;}

  /* Badges / conquistas */
  .badge-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
  .badge-item{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 4px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px;}
  .badge-item.locked{opacity:.35; filter:grayscale(1);}
  .badge-item .badge-icon{font-size:22px;}
  .badge-item .badge-label{font-size:9.5px; font-weight:700; color:var(--muted); line-height:1.25;}
  .badge-item.earned .badge-label{color:var(--text);}

  /* Day completion card */
  .day-complete-card{display:flex; align-items:center; gap:14px; margin-bottom:14px;}

  /* Calendário de evolução */
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .cal-month-label{font-weight:800; color:var(--text); font-size:14.5px; text-transform:capitalize;}
  .cal-nav{background:var(--primary-soft); border:none; color:var(--primary); font-weight:800; width:32px; height:32px; border-radius:9px; cursor:pointer; font-size:15px;}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10.5px; font-weight:800; color:var(--muted); margin-bottom:4px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-cell{display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; border-radius:8px;}
  .cal-cell.today{background:var(--primary-soft);}
  .cal-cell.empty{visibility:hidden;}
  .cal-dot{width:8px; height:8px; border-radius:50%;}
  .cal-daynum{font-size:10px; font-weight:700; color:var(--text);}
  .cal-legend{display:flex; flex-wrap:wrap; gap:8px 12px; margin-top:14px; padding-top:12px; border-top:1px solid var(--border);}
  .cal-legend span{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--muted); font-weight:600;}
  .cal-legend i{width:8px; height:8px; border-radius:50%; display:inline-block;}

  /* Linha do tempo */
  .timeline-item{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); font-size:13px; color:var(--text);}
  .timeline-item:last-child{border-bottom:none;}
  .ti-icon{font-size:16px; flex-shrink:0;}

  /* Desafios */
  .challenge-card{margin-bottom:12px;}

  /* Compulsão */
  .craving-card{border-color:var(--orange);}

  /* Planejamento alimentar */
  .plan-row{display:flex; align-items:center; gap:8px; font-size:12.5px; cursor:pointer;}
  .plan-row-wrap{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--border);}
  .plan-row-wrap:last-child{border-bottom:none;}
  .plan-slot{font-weight:800; color:var(--primary); min-width:52px; font-size:10.5px; text-transform:uppercase;}
  .plan-name{flex:1; color:var(--text); font-weight:600;}
  .plan-kcal{color:var(--muted); font-size:11px; flex-shrink:0;}
  .plan-log-btn{flex-shrink:0; background:var(--primary-soft); color:var(--primary); border:none; border-radius:8px; padding:6px 9px; font-size:10.5px; font-weight:800; cursor:pointer;}
  .plan-log-btn.done{background:var(--border); color:var(--muted); cursor:default;}

  /* Lista de compras */
  .shop-item{display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid var(--border); font-size:13.5px; color:var(--text);}
  .shop-item:last-child{border-bottom:none;}
  .shop-done{text-decoration:line-through; color:var(--muted);}

  /* Relatório mensal */
  .rp-row{display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px; color:var(--text);}
  .rp-row:last-child{border-bottom:none;}
  .rp-row span{color:var(--muted); font-weight:600;}
  .rp-row b{font-weight:800;}
  .rp-arrow.good{color:var(--green);}
  .rp-arrow.bad{color:var(--red);}
  .rp-arrow.same{color:var(--muted);}

  /* Jejum intermitente */
  .fast-track{display:flex; align-items:center; overflow-x:auto; padding:6px 2px;}
  .ft-step{display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0;}
  .ft-dot{width:26px; height:26px; border-radius:50%; background:var(--border); color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800;}
  .ft-step.current .ft-dot{background:var(--primary); color:#fff;}
  .ft-label{font-size:9px; font-weight:700; color:var(--muted); white-space:nowrap;}
  .ft-step.current .ft-label{color:var(--text);}
  .ft-line{width:16px; height:2px; background:var(--border); flex-shrink:0; margin-bottom:16px;}
  .protocol-card{margin-bottom:10px; cursor:pointer;}
  .protocol-card.selected{border-color:var(--primary); background:var(--primary-soft);}
  .proto-tag{font-size:9.5px; font-weight:800; color:var(--primary); background:var(--primary-soft); padding:2px 6px; border-radius:6px; margin-left:4px; vertical-align:middle;}

  /* Menu Mais */
  .mais-item{display:flex; align-items:center; gap:12px; cursor:pointer; margin-bottom:10px;}

  /* Favoritos de refeição */
  .fav-meal-row{display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--border); border-radius:10px; margin-bottom:6px; cursor:pointer; background:var(--card);}
  .fav-meal-row:hover{border-color:var(--primary);}
  .fav-meal-icon{font-size:15px;}
  .fav-meal-name{flex:1; font-size:12.5px; font-weight:700; color:var(--text);}
  .fav-meal-kcal{font-size:11px; color:var(--muted); flex-shrink:0;}
  .fav-meal-del{background:none; border:none; font-size:12px; cursor:pointer; opacity:.6; padding:2px 4px;}
  .fav-checkbox{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text); font-weight:600; margin:4px 0 14px 0; cursor:pointer;}
  .fav-checkbox input{width:16px; height:16px;}
  .btn.ghost{background:none; border:1px dashed var(--border); color:var(--muted);}

  /* Sono & Humor */
  .mood-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:6px;}
  .mood-btn{display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--card); border:1.5px solid var(--border); border-radius:14px; padding:14px 4px; cursor:pointer;}
  .mood-btn.active{border-color:var(--primary); background:var(--primary-soft);}
  .mood-emoji{font-size:26px;}
  .mood-label{font-size:10px; font-weight:700; color:var(--muted);}
  .mood-btn.active .mood-label{color:var(--text);}

  .notif-dot{position:absolute; top:2px; right:2px; width:8px; height:8px; border-radius:50%; background:var(--red); border:1.5px solid var(--card);}

  @media print{
    .tabbar, .topbar .action, .no-print, .install-banner{ display:none !important; }
    body{ background:#fff !important; }
    .app{ max-width:100% !important; box-shadow:none !important; }
    #main{ padding-top:6px !important; }
    .card, .coach-card{ break-inside:avoid; border:1px solid #ccc !important; background:#fff !important; }
  }

  /* Recipes & exercises */
  .filter-chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .filter-chips button{padding:8px 13px; border-radius:20px; border:1.5px solid var(--border); background:var(--card); font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer;}
  .filter-chips button.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .recipe-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; cursor:pointer;}
  .recipe-card .rc-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .recipe-card .rc-name{font-size:15px; font-weight:800; color:var(--text);}
  .recipe-card .rc-badge{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--primary-soft); color:var(--primary); white-space:nowrap;}
  .recipe-card .rc-meta{font-size:11.5px; color:var(--muted); margin-top:5px;}
  .exercise-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; cursor:pointer;}
  .exercise-card .ec-top{display:flex; align-items:center; gap:10px;}
  .exercise-card .ec-icon{font-size:24px; width:36px; text-align:center; flex-shrink:0;}
  .exercise-card .ec-name{font-size:15px; font-weight:800; color:var(--text); flex:1;}
  .exercise-card .ec-diff{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .exercise-card .ec-diff.iniciante{background:var(--green-soft); color:var(--green);}
  .exercise-card .ec-diff.intermediario{background:var(--orange-soft); color:var(--orange);}
  .exercise-card .ec-diff.avancado{background:var(--red-soft); color:var(--red);}
  .exercise-card .ec-meta{font-size:11.5px; color:var(--muted); margin-top:6px; margin-left:46px;}
  .detail-steps{margin:0; padding-left:20px;}
  .detail-steps li{margin-bottom:8px; font-size:14px; line-height:1.5; color:var(--text);}
  .ingredient-list{margin:0 0 14px 0; padding-left:20px;}
  .ingredient-list li{font-size:14px; line-height:1.6; color:var(--text);}
  .today-workout-row{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px;}

  .toast{position:fixed; bottom:76px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 18px; border-radius:30px; font-size:13.5px; z-index:200; opacity:0; pointer-events:none; transition:opacity .25s; max-width:85%; text-align:center;}
  .toast.show{opacity:1;}

/* === HOME VIVA LEVE STYLES === */
.day-summary-card {
  background: linear-gradient(135deg, var(--card) 0%, var(--card-elevated) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 4px 20px rgba(124, 58, 237, 0.07);
}
.summary-mini-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 14px;
}
.summary-mini-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
}
.summary-mini-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.summary-mini-val {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-top: 2px;
}
.quick-actions-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}
.quick-action-btn {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: left;
}
.quick-action-btn:active {
  transform: scale(0.98);
  border-color: var(--primary);
}
.qa-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.qa-info {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.qa-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.qa-sub {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

</style>
</head>
<body>
<div id="app">
  <div id="topbar" class="topbar"></div>
  <main id="main"></main>
  <div id="tabbar" class="tabbar"></div>
</div>
<div id="overlay" class="overlay hidden"><div class="modal" id="modalBody"></div></div>
<div id="toast" class="toast"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<script src="/app.js"></script>
</body>
</html>
