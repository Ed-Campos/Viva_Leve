<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Viva Leve</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viva Leve">
<meta name="theme-color" content="#7C3AED">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Viva Leve — acompanhe peso, água, refeições, jejum e hábitos no seu ritmo.">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<style>
:root, [data-theme="light"] {
  --bg: #F7F5FC;
  --bg-gradient: linear-gradient(180deg, #F5F0FF 0%, #FBF9FE 100%);
  --card: #FFFFFF;
  --card-elevated: #FFFFFF;
  --border: #E8E2F8;
  --border-light: rgba(124, 58, 237, 0.12);
  --text: #1E1B4B;
  --text-primary: #1E1B4B;
  --text-secondary: #4C1D95;
  --muted: #6B7280;
  --primary: #7C3AED;
  --primary-hover: #6D28D9;
  --primary-soft: rgba(124, 58, 237, 0.08);
  --accent: #A78BFA;
  --lilac: #7C3AED;
  --gold: #D97706;
  --gold-soft: rgba(217, 119, 6, 0.12);
  --green: #10B981;
  --danger: #EF4444;
  --warning: #F59E0B;
  --tab-bg: #FFFFFF;
  --tab-border: #E8E2F8;
  --radius: 14px;
  --radius-sm: 8px;
  --radius-lg: 20px;
  --shadow: 0 4px 16px rgba(124, 58, 237, 0.08);
  --shadow-lg: 0 10px 28px rgba(124, 58, 237, 0.12);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}

[data-theme="dark"] {
  --bg: #0B0A12;
  --bg-gradient: linear-gradient(180deg, #131124 0%, #0B0A12 100%);
  --card: #171527;
  --card-elevated: #201D36;
  --border: #2B264A;
  --border-light: rgba(167, 139, 250, 0.15);
  --text: #F3F1F8;
  --text-primary: #F3F1F8;
  --text-secondary: #DDD6FE;
  --muted: #8E8AAB;
  --primary: #8B5CF6;
  --primary-hover: #7C3AED;
  --primary-soft: rgba(139, 92, 246, 0.14);
  --accent: #C4B5FD;
  --lilac: #DDD6FE;
  --gold: #F59E0B;
  --gold-soft: rgba(245, 158, 11, 0.15);
  --green: #10B981;
  --danger: #EF4444;
  --warning: #F59E0B;
  --tab-bg: #131124;
  --tab-border: #2B264A;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
}

#app {
  max-width: 540px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-bottom: 84px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 4px 20px rgba(124, 58, 237, 0.25);
}
.topbar h1 {
  font-size: 18px;
  font-weight: 700;
  color: #FFFFFF;
  letter-spacing: -0.3px;
}
.topbar .action {
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #FFFFFF;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
}

main {
  flex: 1;
  padding: 16px 18px 24px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

.day-summary-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
}
.summary-mini-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 14px;
}
.summary-mini-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
}
.summary-mini-label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
}
.summary-mini-val {
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
  margin-top: 2px;
}

.quick-actions-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}
.quick-action-btn {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s ease;
  box-shadow: var(--shadow);
  width: 100%;
}
.quick-action-btn:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-lg);
  border-color: var(--primary);
}
.qa-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.qa-info {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.qa-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}
.qa-sub {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 540px;
  margin: 0 auto;
  height: 64px;
  background: var(--tab-bg);
  border-top: 1px solid var(--tab-border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 40;
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button {
  background: transparent;
  border: none;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  padding: 8px 16px;
  flex: 1;
}
.tabbar button.active {
  color: var(--primary);
}
.tabbar button .ticon {
  font-size: 20px;
}

.btn {
  background: var(--primary);
  color: #FFFFFF;
  border: none;
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
}
.btn-secondary {
  background: var(--primary-soft);
  color: var(--primary);
  border: 1px solid var(--border);
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(11, 10, 18, 0.75);
  backdrop-filter: blur(4px);
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.overlay.hidden { display: none; }
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 22px 20px 32px;
}
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: #1E1B4B;
  color: #FFFFFF;
  padding: 10px 18px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 600;
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar" class="topbar"></div>
  <main id="main"></main>
  <div id="tabbar" class="tabbar"></div>
</div>
<div id="overlay" class="overlay hidden"><div class="modal" id="modalBody"></div></div>
<div id="toast" class="toast"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<script src="/app.js?v=20260918"></script>
</body>
</html>
